@font-face{font-family:H;src:url(hanken-400.ttf);font-weight:400}
@font-face{font-family:H;src:url(hanken-800.ttf);font-weight:800}
@font-face{font-family:M;src:url(plexmono-400.ttf)}
*{box-sizing:border-box;margin:0}
:root{--paper:#F6F3EE;--ink:#1E2321;--muted:#5A615D;--sig:#F7701F;--sigtxt:#B5450F;--inkt:#101C34;--onmut:#A8B4CC}
body{font-family:H,system-ui,sans-serif;position:relative;overflow:hidden;display:flex;flex-direction:column;background:var(--inkt)}
body.p{width:1080px;height:1350px;font-size:16px}
body.l{width:1200px;height:627px;font-size:10px}
.top{background:var(--paper);color:var(--ink);flex:1;display:flex;flex-direction:column}
.p .top{padding:80px 80px 0}.l .top{padding:34px 70px 0}
.head{display:flex;justify-content:space-between;align-items:flex-start}
.lock{display:flex;align-items:center;gap:1.1em}
.lock svg{height:4.6em;width:auto;display:block}
.lock b{display:block;font-weight:800;font-size:2.1em;line-height:1;letter-spacing:-.02em}
.lock span{display:block;font-weight:400;font-size:2.1em;line-height:1.05;color:var(--muted)}
.date{font-family:M;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);font-size:1.35em;text-align:right;line-height:1.5}
h1{font-weight:800;letter-spacing:-.045em;line-height:.92;margin-top:auto;margin-bottom:.9em}
.p h1{font-size:8.6em;line-height:.95}.l h1{font-size:6.2em;margin-bottom:.6em}
.ln{letter-spacing:-.04em;display:block;white-space:nowrap;width:max-content}.ln.o{color:var(--sig)}h1{font-kerning:normal;text-rendering:optimizeLegibility;font-feature-settings:"kern" 1,"liga" 1}
.bottom{background:var(--inkt);color:var(--paper)}
.p .bottom{padding:54px 80px 60px}.l .bottom{padding:24px 70px 26px}
.mono{font-family:M;text-transform:uppercase;letter-spacing:.08em;color:var(--onmut)}
.p .mono.s{font-size:1.3em;margin-bottom:.5em}.l .mono.s{font-size:1.15em}
.path svg{width:100%;display:block;overflow:visible}
.labels{display:grid;grid-template-columns:repeat(5,1fr);text-align:center;margin-top:.9em}
.labels span{font-family:M;text-transform:uppercase;letter-spacing:.04em;color:var(--onmut)}
.p .labels span{font-size:1.15em}.l .labels span{font-size:1.1em}
.cta{display:flex;align-items:center;justify-content:space-between;gap:2em;border-top:1px solid rgba(246,243,238,.16)}
.p .cta{margin-top:2em;padding-top:1.8em;flex-direction:column;align-items:flex-start;gap:.9em}.l .cta{margin-top:1.4em;padding-top:1.3em}
.cta p{line-height:1.3}.p .cta p{font-size:1.9em;color:var(--onmut)}.act{font-weight:800;color:var(--sig);letter-spacing:-.03em;line-height:1;display:flex;align-items:center;gap:.35em;white-space:nowrap}.p .act{font-size:5.6em}.l .cta p{font-size:1.8em}
.cta p i{font-style:normal;color:var(--onmut)}
.btn{background:var(--sig);color:var(--inkt);font-weight:800;border-radius:.4em;white-space:nowrap}
.p .btn{font-size:2em;padding:.65em 1em}.l .btn{font-size:1.7em;padding:.6em .9em}
</style></head><body class="p">
