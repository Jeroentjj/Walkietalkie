<!doctype html>
<html lang="nl"><head><meta charset="utf-8"><title>BlazeWay Studio launch v2</title>
<style>
@font-face{font-family:N;src:url(nunito.woff2);font-weight:700}
*{box-sizing:border-box;margin:0}
:root{--bg:#3B3F45;--o:#F28C3A;--c:#F5F1EA;--m:#B9BDC2;--g:#8A8F96}
body{background:var(--bg);color:var(--c);font-family:"Segoe UI",system-ui,-apple-system,sans-serif;position:relative;overflow:hidden}
body.p{width:1080px;height:1350px;font-size:16px;padding:100px 80px 90px;display:flex;flex-direction:column}
body.l{width:1200px;height:627px;font-size:11px;padding:38px 70px 34px;display:flex;flex-direction:column}
.date{color:var(--o)}.p .date{font-size:2em}.l .date{font-size:1.7em}
h1{font-family:N,"Segoe UI",sans-serif;font-weight:700;letter-spacing:-.02em;line-height:1;margin-top:.55em}
.p h1{font-size:9em}.l h1{font-size:6.6em}
.tag{color:var(--m);margin-top:.35em}
.p .tag{font-size:2.8em;line-height:1.25}.l .tag{font-size:2.2em}
.path{margin-top:auto}
.path svg{width:100%;display:block;overflow:visible}
.labels{display:grid;grid-template-columns:repeat(5,1fr);text-align:center;color:var(--m);margin-top:1em}
.p .labels{font-size:1.4em}.l .labels{font-size:1.5em}
.cta{margin-top:2.2em;padding-top:1.6em;border-top:1px solid rgba(245,241,234,.18)}
.p .cta{font-size:2.5em;line-height:1.3}.l .cta{font-size:1.8em;line-height:1.3;margin-top:1.2em;padding-top:1em}
.cta em{font-style:normal;color:var(--o)}
</style></head><body class="p">
<div class="date">Officiële start · 1 november 2026</div>
<h1>BlazeWay Studio</h1>
<p class="tag">Van eerste idee tot productie.<br>Samen op pad.</p>
<div class="path">
<svg viewBox="0 30 1000 140"><g fill="none" stroke-linecap="round">
<path d="M100 100 C150 30 250 30 300 100 C350 170 450 170 500 100" stroke="#F28C3A" stroke-width="7"/>
<path d="M500 100 C550 30 650 30 700 100 C750 170 850 170 900 100" stroke="#8A8F96" stroke-width="6" stroke-dasharray="0.1 16"/>
<circle cx="100" cy="100" r="13" fill="#F28C3A"/><circle cx="300" cy="100" r="13" fill="#F28C3A"/><circle cx="500" cy="100" r="13" fill="#F28C3A"/>
<circle cx="700" cy="100" r="12" stroke="#8A8F96" stroke-width="4" fill="#3B3F45"/><circle cx="900" cy="100" r="12" stroke="#8A8F96" stroke-width="4" fill="#3B3F45"/>
</g></svg>
<div class="labels"><span>onderzoeken</span><span>experimenteren</span><span>engineering</span><span>productie</span><span>begeleiden</span></div>
</div>
<div class="cta">Gaaf project? Nieuwe inzichten nodig? Capaciteit tekort?<br><em>Stuur me een bericht.</em></div>
<script>if(location.hash==='#l')document.body.className='l'</script>
</body></html>
