<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<meta name="theme-color" content="#f6a21a">
<title>Walkie</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg">
<style>
  :root { --or:#f6a21a; --or2:#d9820a; --ink:#151515; --seg:#f2f2f2; }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; user-select:none; }
  html,body { margin:0; height:100%; overflow:hidden; background:#f6a21a; font-family:system-ui,sans-serif; }
  body { display:flex; }
  .radio { position:relative; width:100%; height:100dvh; display:flex; flex-direction:column; padding:max(34px,env(safe-area-inset-top)) 26px max(20px,env(safe-area-inset-bottom));
    background:linear-gradient(100deg,var(--or2),var(--or) 18%,#fbb238 50%,var(--or) 82%,var(--or2));
    box-shadow:inset 0 3px 4px #fff6, inset 0 -6px 10px #0002; }
  .radio::before { content:''; position:absolute; left:0; top:90px; width:8px; height:120px; background:#1a1a1a; border-radius:4px 0 0 4px; }
  .led { position:absolute; left:34px; top:16px; width:30px; height:9px; border-radius:5px; background:#fff3e0; box-shadow:inset 0 1px 2px #0004; transition:.15s; }
  .led.on { background:#5f5; box-shadow:0 0 10px #5f5; }
  .led.tx { background:#f33; box-shadow:0 0 12px #f33; }
  .lcd { background:#111; border-radius:16px; padding:10px; box-shadow:inset 0 0 0 3px #2a2a2a; }
  .scr { background:#050505; border-radius:6px; padding:8px 12px; color:var(--seg); min-height:120px; position:relative; }
  .num { font:700 64px/1 "Courier New",monospace; letter-spacing:2px; display:flex; align-items:flex-end; gap:12px; }
  .num small { font-size:34px; }
  .ch { position:absolute; right:12px; top:8px; display:flex; gap:6px; align-items:center; font-size:11px; }
  .bars { display:flex; gap:2px; height:10px; align-items:flex-end; }
  .bars i { width:4px; background:var(--seg); opacity:.15; } .bars i.a { opacity:1; }
  .st { font:12px ui-monospace,monospace; margin-top:14px; flex:none; color:#ccc; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  #chName { display:none; }
  .keys { display:flex; align-items:center; justify-content:space-between; margin:22px 12px 8px; }
  .k { border:0; background:none; color:var(--ink); font:900 44px/1 system-ui; width:64px; height:64px; padding:0; }
  .k:active { transform:scale(.9); }
  #ptt { width:84px; height:84px; border-radius:8px; border:0; background:linear-gradient(#2a2a2a,#0d0d0d); color:#f6a21a; font:900 14px system-ui;
    letter-spacing:2px; box-shadow:0 6px 0 #000, 0 8px 14px #0006; touch-action:none; }
  #ptt.down { transform:translateY(5px); box-shadow:0 1px 0 #000; color:#f33; }
  #ptt:disabled { color:#666; }
  .grille { flex:1; min-height:80px; margin-top:14px; border-radius:20px 20px 50px 50px;
    background:radial-gradient(circle,#0e0e0e 3.4px,transparent 4px) center/18px 18px,
      radial-gradient(circle,#c27612 2.2px,transparent 2.6px) 0 0/16px 16px;
    -webkit-mask:radial-gradient(ellipse 65% 60% at 50% 45%,#000 60%,#0008 75%,#0005); }
  .brand { text-align:center; font:900 italic 22px system-ui; letter-spacing:2px; color:var(--ink); margin-top:14px; flex:none; }
  dialog { border:0; border-radius:18px; background:#24272a; color:#eee; width:min(92vw,360px); padding:20px; }
  dialog::backdrop { background:#000b; }
  dialog input { width:100%; padding:12px; border-radius:10px; border:1px solid #555; background:#111; color:#fff; font-size:16px; margin:8px 0; }
  dialog button { padding:11px 14px; border-radius:10px; border:0; font-weight:700; margin-top:14px; flex:none; }
  .prim { background:var(--or); color:#111; } .sec { background:#3d4145; color:#eee; }
  dialog small { color:#999; line-height:1.4; display:block; }
</style>
</head>
<body>
<div class="radio">
  <span class="led" id="led"></span>
  <div class="lcd"><div class="scr">
    <div class="ch"><div class="bars" id="bars"><i style="height:3px"></i><i style="height:5px"></i><i style="height:7px"></i><i style="height:10px"></i></div></div>
    <div class="num"><span id="chNum">--</span><small id="chSub">OFF</small></div>
    <div class="st" id="status">Druk op +</div>
    <div id="chName"></div>
  </div></div>
  <div class="keys">
    <button class="k" id="offBtn" aria-label="Uit">−</button>
    <button id="ptt" disabled>PTT</button>
    <button class="k" id="chBtn" aria-label="Kanaal">+</button>
  </div>
  <div class="grille"></div>
  <div class="brand">WALKIE</div>
</div>

<dialog id="dlg">
  <h3 style="margin-top:0">Privé kanaal</h3>
  <small>Deel deze geheime code met één andere persoon (bijv. via WhatsApp). Wie de code heeft, kan meeluisteren — houd hem dus geheim.</small>
  <input id="code" autocomplete="off" spellcheck="false" placeholder="geheime kanaalcode">
  <div style="display:flex;gap:8px;flex-wrap:wrap">
    <button class="sec" id="genBtn">Nieuwe code</button>
    <button class="sec" id="shareBtn">Delen</button>
    <button class="prim" id="joinBtn" style="margin-left:auto">Verbind</button>
  </div>
</dialog>

<audio id="remote" autoplay playsinline></audio>
<script src="https://cdnjs.cloudflare.com/ajax/libs/peerjs/1.5.4/peerjs.min.js"></script>
<script>
// Walkie: P2P push-to-talk over WebRTC (DTLS-SRTP encrypted end-to-end).
// The PeerJS server is only used for signaling; it sees a hash of the channel code, never audio.
const $ = (id) => document.getElementById(id);
const led = $('led'), status = $('status'), ptt = $('ptt'), remoteAudio = $('remote'), dlg = $('dlg');

let peer, call, conn, mic, channel, retryTimer, audioCtx, remoteTalking = false;
// Default PeerJS STUN/TURN plus Google STUN, so it also works behind mobile-network NAT.
const PEER_OPTS = { config: { iceServers: [
  { urls: 'stun:stun.l.google.com:19302' },
  { urls: 'turn:eu-0.turn.peerjs.com:3478', username: 'peerjs', credential: 'peerjsp' },
  { urls: 'turn:us-0.turn.peerjs.com:3478', username: 'peerjs', credential: 'peerjsp' },
] } };

const setStatus = (t) => (status.textContent = t);

async function sha256(text) {
  const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode('walkie:' + text));
  return [...new Uint8Array(buf)].map((b) => b.toString(16).padStart(2, '0')).join('');
}

function beep(freqs) {
  audioCtx ||= new AudioContext();
  let t = audioCtx.currentTime;
  for (const f of freqs) {
    const o = audioCtx.createOscillator(), g = audioCtx.createGain();
    o.frequency.value = f; g.gain.value = 0.08;
    o.connect(g).connect(audioCtx.destination);
    o.start(t); o.stop(t + 0.07); t += 0.08;
  }
}

function genCode() {
  const words = ['vos', 'uil', 'das', 'reiger', 'otter', 'havik', 'eland', 'lynx', 'raaf', 'wolf'];
  const r = crypto.getRandomValues(new Uint32Array(3));
  return `${words[r[0] % words.length]}-${words[r[1] % words.length]}-${(r[2] % 1e6).toString().padStart(6, '0')}`;
}

let linked = false;
function setLinked(on) {
  linked = on;
  led.className = on ? 'led on' : 'led';
  ptt.disabled = !channel; // when not linked, PTT sends a ring notification instead
  document.querySelectorAll('#bars i').forEach((b) => b.classList.toggle('a', on));
  setStatus(on ? 'Verbonden ✓' : channel ? 'Wachten… PTT = oproepen' : 'Druk op +');
}

function hangup() {
  clearTimeout(retryTimer);
  call?.close(); conn?.close(); peer?.destroy();
  call = conn = peer = null;
  remoteTalking = false;
}

function wireConn(c) {
  conn = c;
  c.on('data', (d) => {
    remoteTalking = !!d.talk;
    if (d.talk) { led.className = 'led tx'; setStatus('◀ Ontvangen…'); }
    else { setLinked(true); beep([1200, 900]); }
  });
  c.on('close', reconnect);
}

function wireCall(c) {
  call = c;
  setStatus('Verbinden…');
  c.on('stream', (s) => { remoteAudio.srcObject = s; remoteAudio.play().catch(() => {}); });
  // 'stream' fires before the audio path is up; only report linked once ICE actually connects.
  const pc = c.peerConnection;
  pc?.addEventListener('iceconnectionstatechange', () => {
    const st = pc.iceConnectionState;
    if (st === 'connected' || st === 'completed') { setLinked(true); beep([900, 1200]); }
    else if (st === 'failed') { setStatus('Geen verbinding mogelijk'); reconnect(); }
    else if (st === 'disconnected') setStatus('Verbinding hapert…');
  });
  c.on('close', reconnect);
  c.on('error', reconnect);
}

function reconnect() {
  if (!channel) return;
  setLinked(false);
  hangup();
  retryTimer = setTimeout(() => join(channel), 3000);
}

// Only one window per device may hold the channel (installed app + browser tab share storage),
// otherwise one phone takes both slots and the other side sees "full".
const tabs = 'BroadcastChannel' in window ? new BroadcastChannel('walkie') : null;
if (tabs) tabs.onmessage = (e) => {
  if (e.data !== 'takeover' || !channel) return;
  channel = null; hangup(); setLinked(false);
  setStatus('Actief in ander venster');
};

async function join(code) {
  hangup();
  tabs?.postMessage('takeover');
  channel = code;
  localStorage.setItem('walkie-ch', code);
  setStatus('Verbinden…');
  if (!mic) {
    try {
      mic = await navigator.mediaDevices.getUserMedia({ audio: { echoCancellation: true, noiseSuppression: true, autoGainControl: true } });
    } catch { setStatus('Microfoon geweigerd'); return; }
  }
  mic.getAudioTracks().forEach((t) => (t.enabled = false));

  const h = (await sha256(code)).slice(0, 40);
  $('chNum').textContent = String(parseInt(h.slice(0, 4), 16) % 100).padStart(2, '0');
  $('chSub').textContent = 'CH';
  setupPush(code);
  const idA = `wt-${h}-a`, idB = `wt-${h}-b`;

  // First to arrive claims slot A and waits; the second takes slot B and calls A.
  const p = new Peer(idA, PEER_OPTS);
  peer = p;
  p.on('open', () => setLinked(false));
  p.on('call', (c) => {
    if (c.peer !== idB) return c.close();
    call?.close();
    c.answer(mic);
    wireCall(c);
  });
  p.on('connection', (c) => { if (c.peer === idB) wireConn(c); else c.close(); });
  p.on('error', (e) => {
    if (e.type === 'unavailable-id' && peer === p) {
      p.destroy();
      const q = new Peer(idB, PEER_OPTS);
      peer = q;
      q.on('open', () => { wireCall(q.call(idA, mic)); wireConn(q.connect(idA, { reliable: true })); });
      q.on('error', (e2) => {
        if (e2.type === 'unavailable-id') {
          // Slots can stay reserved for a little while after someone leaves; keep trying.
          setStatus('Kanaal bezet, opnieuw proberen…');
          q.destroy();
          retryTimer = setTimeout(() => join(channel), 5000);
        } else reconnect();
      });
    } else if (e.type !== 'peer-unavailable') {
      setStatus('Fout: ' + e.type);
      reconnect();
    }
  });
}

// Mobile browsers block audio until a tap; retry playback on every interaction.
function unlockAudio() {
  remoteAudio.play().catch(() => {});
  audioCtx ||= new AudioContext();
  audioCtx.resume();
}
document.addEventListener('pointerdown', unlockAudio);

// --- Push "ring": notify the partner when their app is closed (needs the Cloudflare /api functions).
const clientId = localStorage.getItem('walkie-id') || crypto.randomUUID().replace(/-/g, '');
localStorage.setItem('walkie-id', clientId);
let pushCh = null, lastRing = 0;

async function setupPush(code) {
  pushCh = (await sha256(code + ':push')).slice(0, 40);
  try {
    if (Notification.permission !== 'granted') return;
    const reg = await navigator.serviceWorker.ready;
    const { key } = await (await fetch('api/vapid')).json();
    const appKey = Uint8Array.from(atob(key.replace(/-/g, '+').replace(/_/g, '/')), (c) => c.charCodeAt(0));
    const sub = (await reg.pushManager.getSubscription()) || (await reg.pushManager.subscribe({ userVisibleOnly: true, applicationServerKey: appKey }));
    await fetch('api/subscribe', { method: 'POST', body: JSON.stringify({ ch: pushCh, id: clientId, sub }) });
  } catch { /* no push support or no backend (e.g. GitHub Pages) */ }
}

async function ring() {
  if (!pushCh || Date.now() - lastRing < 15000) return;
  lastRing = Date.now();
  navigator.vibrate?.(60);
  setStatus('📣 Oproepen…');
  try {
    const { sent } = await (await fetch('api/ring', { method: 'POST', body: JSON.stringify({ ch: pushCh, id: clientId }) })).json();
    if (!linked) setStatus(sent ? '📣 Partner opgeroepen' : 'Partner heeft geen meldingen aan');
  } catch { if (!linked) setStatus('Oproepen niet beschikbaar'); }
}

function talk(on) {
  if (ptt.disabled) return;
  if (!linked) { if (on) ring(); return; }
  if (!mic) return;
  if (on && remoteTalking) { navigator.vibrate?.([40, 40, 40]); return; } // other side is talking
  if (!on && !ptt.classList.contains('down')) return;
  // Half-duplex like a real walkie: mute the speaker while sending, so it can't echo back.
  remoteAudio.muted = on;
  mic.getAudioTracks().forEach((t) => (t.enabled = on));
  ptt.classList.toggle('down', on);
  led.className = on ? 'led tx' : 'led on';
  setStatus(on ? '▶ Zenden…' : 'Verbonden ✓');
  if (conn?.open) conn.send({ talk: on });
  if (on) navigator.vibrate?.(30); else beep([1500]);
}

ptt.addEventListener('pointerdown', (e) => { e.preventDefault(); unlockAudio(); ptt.setPointerCapture(e.pointerId); talk(true); });
['pointerup', 'pointercancel'].forEach((ev) => ptt.addEventListener(ev, () => talk(false)));
ptt.addEventListener('contextmenu', (e) => e.preventDefault());

$('chBtn').onclick = () => { $('code').value = channel || genCode(); dlg.showModal(); };
$('genBtn').onclick = () => ($('code').value = genCode());
$('shareBtn').onclick = () => {
  const text = `Mijn walkie-kanaal: ${$('code').value}`;
  if (navigator.share) navigator.share({ text }).catch(() => {});
  else navigator.clipboard.writeText($('code').value).then(() => alert('Gekopieerd'));
};
$('joinBtn').onclick = () => {
  const c = $('code').value.trim();
  if (c.length < 6) return alert('Code moet minstens 6 tekens zijn');
  if ('Notification' in window && Notification.permission === 'default') Notification.requestPermission().then(() => setupPush(c));
  dlg.close();
  join(c);
};
$('offBtn').onclick = () => {
  channel = null; hangup(); localStorage.removeItem('walkie-ch');
  mic?.getTracks().forEach((t) => t.stop()); mic = null;
  $('chNum').textContent = '--'; $('chSub').textContent = 'OFF'; setLinked(false);
};

const saved = localStorage.getItem('walkie-ch');
if (saved) join(saved);

if (location.protocol === 'https:' && 'serviceWorker' in navigator) navigator.serviceWorker.register('sw.js');
</script>
</body>
</html>
