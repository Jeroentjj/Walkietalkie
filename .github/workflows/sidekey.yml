name: Zijknop APK

on:
  push:
    branches: [main]
    paths: ["sidekey/**", ".github/workflows/sidekey.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"
      - name: Restore signing key
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then echo "::error::Secret KEYSTORE_B64 ontbreekt; zie README"; exit 1; fi
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/walkie.jks"
      - name: Build APK
        working-directory: sidekey
        env:
          WALKIE_KEYSTORE: ${{ runner.temp }}/walkie.jks
          WALKIE_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: gradle --no-daemon assembleRelease
      - name: Publish as "zijknop" release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp sidekey/app/build/outputs/apk/release/app-release.apk wlky-zijknop.apk
          gh release delete zijknop --yes --cleanup-tag || true
          gh release create zijknop wlky-zijknop.apk --title "WLKY Zijknop (Android)" \
            --notes "Extra acties voor de programmeerbare zijknop (zaklamp, geluid, camera, locatie delen, bel favoriet, assistent, slim). Automatisch gebouwd vanaf ${GITHUB_SHA::7}."
