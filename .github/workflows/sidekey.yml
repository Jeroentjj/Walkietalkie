name: Zijknop APK

on:
  push:
    branches: [main]
    paths: ["sidekey/**", ".github/workflows/sidekey.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"
      - name: Restore signing key
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then echo "::error::Secret KEYSTORE_B64 ontbreekt; zie README"; exit 1; fi
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/walkie.jks"
      - name: Build APK
        working-directory: sidekey
        env:
          WALKIE_KEYSTORE: ${{ runner.temp }}/walkie.jks
          WALKIE_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: gradle --no-daemon assembleRelease
      - name: Publish as "zijknop" release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for f in torch sound camera location call assist smart; do
            cp "sidekey/app/build/outputs/apk/$f/release/app-$f-release.apk" "zijknop-$f.apk"
          done
          gh release delete zijknop --yes --cleanup-tag || true
          gh release create zijknop zijknop-*.apk --title "WLKY Zijknop (Android)" \
            --notes "Acties voor de programmeerbare zijknop, elk een eigen kleine app (installeer alleen wat je wilt): zijknop-torch (zaklamp), -sound (geluid wisselen), -camera, -location (locatie delen), -call (bel favoriet), -assist (spraakassistent), -smart (slim: niets in WLKY, anders een app naar keuze). Gebouwd vanaf ${GITHUB_SHA::7}."
