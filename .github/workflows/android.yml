name: Android APK

on:
  push:
    branches: [main]
    paths: ["android/**", "public/**", ".github/workflows/android.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Build APK
        working-directory: android
        run: gradle --no-daemon assembleRelease
      - name: Publish as "latest" release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk walkie.apk
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest walkie.apk --title "Walkie Talkie (Android)" \
            --notes "Automatisch gebouwd vanaf ${GITHUB_SHA::7}. Download walkie.apk en installeer op Android."
