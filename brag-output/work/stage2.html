    --key:min(76px,10dvh,calc((100vw - 110px) / 4)); --ptt:calc(var(--key) * 2 + 14px); }
  /* Rubber keys: matte dark grey, icons and labels pressed into the rubber (no colour). */
  .k, #ptt { border:0; padding:0; color:#1c1c1c; touch-action:none;
    background:radial-gradient(120% 90% at 50% 15%,#4a4a4a,#333 55%,#262626);

    box-shadow:0 0 0 2.5px #050505, 0 0 0 3.5px #0005, 0 1px 0 4px #ffd69a80, inset 0 1.5px 1px #ffffff38, inset 0 -3px 4px #0007;
    display:flex; flex-direction:column; align-items:center; justify-content:center; gap:5px; transition:transform .05s, box-shadow .05s; }
  .k { border-radius:16px; }
  .k svg, #ptt svg { width:30px; height:30px; }

  .k small, #ptt small, #ptt b { filter:url(#soft) drop-shadow(0 .8px .5px #0009); } /* dark rim all around, a bit deeper on top */ /* white paint in an engraving */
  .k svg, #ptt svg { filter:drop-shadow(0 .8px .5px #0009); } /* print sits just on top of the rubber */ /* flat silkscreen print */
  .k small, #ptt small { font:700 11px Round, system-ui; letter-spacing:.8px; color:#e6e6e6; }
  .k:active, .k.on, #ptt.down { transform:scale(.97); filter:brightness(.85); box-shadow:0 0 0 3.5px #050505, 0 0 0 4.5px #0005, 0 1px 0 5px #ffd69a80, inset 0 3px 5px #0009; }
  #prevBtn { grid-area:1/1; } #menuBtn { grid-area:2/1; } #nextBtn { grid-area:1/3; } #muteBtn { grid-area:2/3; }

  #ptt:disabled { opacity:.75; }
  /* Speaker vents: four pressed-in slots in the shell, each with a raised lip and two thin openings. */

  .vent { flex:1; max-height:30px; margin:3px 0; position:relative; border-radius:99px;
    background:linear-gradient(#e48d0c,#f19b14 60%,#f6a21a);

    background:linear-gradient(#fbb43d,#f6a21a); box-shadow:0 2px 3px #0004, inset 0 1px 0 #fff8; }

  .vent i:first-child { left:14%; width:34%; } .vent i:last-child { left:52%; width:34%; }
  .vent:nth-child(2) i:first-child { left:10%; } .vent:nth-child(3) i:last-child { width:38%; } .vent:nth-child(4) i:first-child { left:18%; width:30%; }
  .brand { text-align:center; font:900 30px system-ui; letter-spacing:12px; text-indent:12px; color:#141414; margin-top:6px; flex:none;
    text-shadow:0 1px 0 #ffd99a, 0 -1px 0 #0004; } /* debossed into the shell */
  dialog { border:0; border-radius:20px; background:#1d1f21; color:#eee; width:min(94vw,420px); max-height:88dvh; padding:0; font-family:system-ui,sans-serif; overflow-x:hidden; scrollbar-width:none; }

 .phone{transform-style:preserve-3d;backface-visibility:hidden;}
